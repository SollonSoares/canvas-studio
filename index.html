<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f1117">
  <link rel="stylesheet" href="style.css">
  <title>Canvas Studio</title>
</head>
<body>

  <!-- Botão flutuante para abertura do menu lateral no Mobile -->
  <button id="mobile-menu-trigger" class="mobile-only-btn" title="Abrir menu" aria-label="Abrir menu lateral">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
  </button>

  <!-- Fundo escurecido translúcido ao abrir menu no Mobile -->
  <div id="sidebar-backdrop"></div>

  <div class="layout-wrapper">
    
    <aside id="dashboard-menu">
      <div class="sidebar-header-row">
        <button id="toggle-sidebar" class="btn-ghost" title="Recolher/Expandir menu lateral">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
        </button>
        <button id="btn-close-mobile-menu" class="btn-close-style mobile-only-btn" title="Fechar Menu">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      
      <div class="brand">
        <h1 id="brand-title" contenteditable="true" spellcheck="false">Naruto RPG</h1>
      </div>

      <div class="menu-group">
        <span class="menu-label">FILTRO</span>
        <input type="text" id="input-search" name="sidebar_search" placeholder="Buscar blocos...">
      </div>

      <nav id="nav-controls">
        <div id="group-criacao" class="menu-group">
          <span class="menu-label">CRIAR ELEMENTOS</span>
          <div id="container-criacao-botoes"></div>
        </div>

        <div id="group-palco" class="menu-group">
          <span class="menu-label">ORGANIZAÇÃO & PALCO</span>
          <div id="container-palco-botoes"></div>
        </div>

        <div id="group-portabilidade" class="menu-group">
          <span class="menu-label">PORTABILIDADE</span>
          <div id="container-portabilidade-botoes" class="btn-group-row"></div>
        </div>

        <!-- Fallback compatível para módulos externos legados -->
        <div id="container-gerenciamento-botoes" style="display:none;"></div>

        <div id="group-wysiwyg" class="menu-group" style="display:none;"></div>
      </nav>

      <div class="sidebar-footer">
        <button id="btn-open-settings" class="btn-ghost">
          <span class="btn-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          </span>
          <span class="btn-label">Configurações</span>
        </button>
        
        <div class="theme-controller-row">
          <span class="theme-label-text">Modo Claro</span>
          <button id="btn-theme" class="apple-switch" title="Alternar tema">
            <span class="thumb"></span>
          </button>
        </div>
      </div>
    </aside>

    <main id="canvas"></main>

  </div>

  <div id="settings-modal">
    <div class="modal-content">
      
      <div class="modal-header">
        <h3>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          Configurações do Sistema
        </h3>
        <button id="btn-close-settings" class="btn-close-style" title="Fechar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <div class="modal-section-modules" style="margin-bottom: 20px;">
        <span class="section-title">MÓDULOS ATIVOS</span>
        <div id="module-activation-panel"></div>
        <label class="btn btn-secondary" style="margin-top: 10px; cursor: pointer;">
          <span class="btn-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
          </span>
          <span class="btn-label">Enviar Módulo (.js)</span>
          <input type="file" id="input-upload-module" accept=".js" style="display: none;">
        </label>
      </div>

      <div class="modal-section-canvas" style="border-top: 1px solid var(--border-subtle); padding-top: 16px;">
        <span class="section-title">DIMENSÕES DO CANVAS</span>
        <div class="canvas-input-group">
          <input type="number" id="input-canvas-w" placeholder="Largura mín. (px)" min="100" max="8000" step="20">
          <input type="number" id="input-canvas-h" placeholder="Altura mín. (px)" min="100" max="8000" step="20">
        </div>
        <button id="btn-save-canvas-size" class="btn btn-primary" style="justify-content: center; width: 100%;">
          Aplicar Dimensões
        </button>
      </div>

    </div>
  </div>

  <script type="module" src="src/core/App.js"></script>
</body>
</html>
